<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>记账报销助手</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:"Microsoft YaHei",system-ui,sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:90px}.hero{padding:26px 20px 24px;background:linear-gradient(135deg,#2563eb,#5b7cff);color:#fff;border-radius:0 0 28px 28px}.hero h1{margin:0 0 8px;font-size:26px}.hero p{margin:0;opacity:.88}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 14px}.stat,.card{background:#fff;border:1px solid #e7ebf3;border-radius:18px;box-shadow:0 8px 24px #23408b0d}.stat{padding:14px 8px;text-align:center}.stat strong{display:block;font-size:20px;color:#2459d3}.stat span{font-size:12px;color:#748096}.toolbar{display:flex;gap:8px;padding:0 14px 10px;overflow-x:auto}.toolbar button{border:0;border-radius:12px;padding:10px 13px;background:#fff;color:#33415c;font-weight:600;white-space:nowrap}.toolbar .active{background:#e8efff;color:#2459d3}.exportbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 12px}.exportbar button{border:1px solid #dbe4fa;border-radius:12px;padding:11px;background:#fff;color:#2856c5;font-weight:700}.list{padding:0 14px;display:grid;gap:12px}.empty{text-align:center;padding:48px 20px;color:#8691a5}.item{padding:16px}.row{display:flex;justify-content:space-between;gap:12px}.item h3{margin:0 0 5px;font-size:17px}.amount{font-size:19px;font-weight:800;color:#172033}.meta{font-size:13px;color:#7b879b;line-height:1.8}.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;background:#eef3ff;color:#3563d7}.badge.overdue{background:#ffeded;color:#d83b3b}.actions{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:13px}.actions button{border:0;border-radius:10px;padding:9px;background:#edf2ff;color:#2856c5}.actions .danger{background:#fff0f0;color:#c33}.actions button:disabled{color:#8a94a7}.fab{position:fixed;right:max(20px,calc((100vw - 720px)/2 + 20px));bottom:22px;border:0;border-radius:18px;padding:15px 20px;background:#2563eb;color:#fff;font-size:16px;font-weight:700;box-shadow:0 12px 30px #2563eb55}.modal{position:fixed;inset:0;background:#11182780;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{width:min(100%,720px);max-height:92vh;overflow:auto;margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:22px 18px 30px}.sheet h2{margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#5d697d}.field input,.field select,.field textarea{width:100%;border:1px solid #dce2ec;border-radius:12px;padding:12px;font:inherit}.field textarea{min-height:72px;resize:vertical}.submit{width:100%;margin-top:18px;border:0;border-radius:13px;padding:14px;background:#2563eb;color:#fff;font-size:16px;font-weight:700}.cancel{width:100%;margin-top:8px;border:0;background:#fff;padding:12px;color:#667085}.hint{padding:0 14px 12px;color:#8a94a7;font-size:12px}@media(max-width:440px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding-top:22px}.stat strong{font-size:17px}.actions{grid-template-columns:1fr 1fr}.actions .danger{grid-column:1/-1}}
  </style>
</head>
<body>
<main class="app">
  <section class="hero"><h1>记账报销助手</h1><p>买完立即记，报销不再忘</p></section>
  <section class="stats">
    <div class="stat"><strong id="pendingMoney">¥0.00</strong><span>待报销</span></div>
    <div class="stat"><strong id="pendingCount">0</strong><span>待处理</span></div>
    <div class="stat"><strong id="overdueCount">0</strong><span>已逾期</span></div>
  </section>
  <nav class="toolbar">
    <button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="待报销">待报销</button><button class="filter" data-filter="已提交">已提交</button><button class="filter" data-filter="已到账">已到账</button>
  </nav>
  <section class="exportbar"><button id="exportTable">⇩ 导出当前记账表格</button><button id="exportAllVouchers">▧ 批量导出凭证图片</button></section>
  <div class="hint">导出内容跟随上方筛选条件；单条凭证也可在记录中直接导出。</div>
  <section class="list" id="list"></section>
  <button class="fab" id="addBtn">＋ 记一笔</button>
</main>
<div class="modal" id="modal"><form class="sheet" id="form">
  <h2>新增报销记录</h2><div class="grid">
    <div class="field full"><label>购买内容 *</label><input name="title" required placeholder="例如：打印纸"></div>
    <div class="field"><label>金额（元）*</label><input name="amount" required type="number" min="0" step="0.01" placeholder="0.00"></div>
    <div class="field"><label>购买日期 *</label><input name="date" required type="date"></div>
    <div class="field"><label>报销截止日期</label><input name="deadline" type="date"></div>
    <div class="field"><label>分类</label><select name="category"><option>办公用品</option><option>差旅</option><option>餐饮</option><option>交通</option><option>其他</option></select></div>
    <div class="field"><label>项目或部门</label><input name="project" placeholder="选填"></div>
    <div class="field"><label>票据照片</label><input name="receipt" type="file" accept="image/*,.pdf"></div>
    <div class="field full"><label>备注</label><textarea name="note" placeholder="发票情况、报销说明等"></textarea></div>
  </div><button class="submit">保存记录</button><button class="cancel" type="button" id="cancelBtn">取消</button>
</form></div>
<script>
const KEY='baoxiao-helper-v1';let records=JSON.parse(localStorage.getItem(KEY)||'[]'),filter='all';
const $=s=>document.querySelector(s),money=n=>'¥'+Number(n).toFixed(2),save=()=>{localStorage.setItem(KEY,JSON.stringify(records));render()};
const currentRecords=()=>records.filter(r=>filter==='all'||r.status===filter);
function overdue(r){return r.status!=='已到账'&&r.deadline&&r.deadline<new Date().toISOString().slice(0,10)}
function render(){const shown=currentRecords();$('#list').innerHTML=shown.length?shown.map(r=>`<article class="card item"><div class="row"><div><h3>${esc(r.title)}</h3><span class="badge ${overdue(r)?'overdue':''}">${overdue(r)?'已逾期':r.status}</span></div><div class="amount">${money(r.amount)}</div></div><div class="meta">${esc(r.category)} · ${esc(r.date)}${r.deadline?' · 截止 '+esc(r.deadline):''}${r.project?' · '+esc(r.project):''}${r.receipt?' · 已附票据':''}${r.note?'<br>'+esc(r.note):''}</div><div class="actions">${r.status==='待报销'?`<button onclick="advance('${r.id}')">标记已提交</button>`:r.status==='已提交'?`<button onclick="advance('${r.id}')">确认已到账</button>`:'<button disabled>已完成</button>'}<button onclick="exportVoucher('${r.id}')">导出凭证</button><button class="danger" onclick="removeItem('${r.id}')">删除</button></div></article>`).join(''):'<div class="empty">当前没有可导出的记录<br>点击右下角“记一笔”开始使用</div>';
const pending=records.filter(r=>r.status!=='已到账');$('#pendingMoney').textContent=money(pending.reduce((s,r)=>s+Number(r.amount),0));$('#pendingCount').textContent=pending.length;$('#overdueCount').textContent=pending.filter(overdue).length}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeName(v=''){return String(v).replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,30)||'报销'}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines=3){let line='',lines=0;for(const ch of String(text||'—')){if(ctx.measureText(line+ch).width>maxWidth&&line){ctx.fillText(line,x,y+lines*lineHeight);line=ch;if(++lines>=maxLines-1)break}else line+=ch}ctx.fillText(line,x,y+lines*lineHeight)}
window.exportVoucher=id=>{const r=records.find(x=>x.id===id);if(!r)return;const c=document.createElement('canvas');c.width=1200;c.height=1500;const x=c.getContext('2d');x.fillStyle='#f4f7ff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';roundRect(x,70,70,1060,1360,34);x.fill();x.fillStyle='#2563eb';x.fillRect(70,70,1060,18);x.fillStyle='#172033';x.textAlign='center';x.font='bold 58px Microsoft YaHei, sans-serif';x.fillText('报 销 凭 证',600,180);x.font='26px Microsoft YaHei, sans-serif';x.fillStyle='#758097';x.fillText('记账报销助手 · 电子凭证',600,230);x.textAlign='left';x.strokeStyle='#e1e7f0';x.lineWidth=2;x.strokeRect(130,300,940,810);const rows=[['凭证编号',voucherNo(r)],['购买日期',r.date||'—'],['购买内容',r.title||'—'],['报销金额','人民币 '+Number(r.amount).toFixed(2)+' 元'],['费用分类',r.category||'—'],['项目/部门',r.project||'—'],['报销状态',overdue(r)?'已逾期':r.status],['截止日期',r.deadline||'—'],['票据附件',r.receipt||'未记录'],['备注',r.note||'—']];let y=300;rows.forEach((row,i)=>{const h=i===9?150:73;x.fillStyle=i%2?'#fbfcff':'#f5f8ff';x.fillRect(130,y,940,h);x.strokeStyle='#e1e7f0';x.strokeRect(130,y,940,h);x.fillStyle='#647087';x.font='26px Microsoft YaHei, sans-serif';x.fillText(row[0],165,y+46);x.fillStyle=i===3?'#d93f3f':'#172033';x.font=i===3?'bold 30px Microsoft YaHei, sans-serif':'28px Microsoft YaHei, sans-serif';wrapText(x,row[1],360,y+46,670,38,i===9?3:1);y+=h});x.fillStyle='#667085';x.font='24px Microsoft YaHei, sans-serif';x.fillText('经办人签字：________________',150,1205);x.fillText('审核人签字：________________',650,1205);x.fillStyle='#98a1b2';x.font='21px Microsoft YaHei, sans-serif';x.textAlign='center';x.fillText('生成时间：'+new Date().toLocaleString('zh-CN'),600,1340);x.fillText('本凭证由记账报销助手根据登记信息生成，请与原始票据一并使用。',600,1385);c.toBlob(b=>download(b,`报销凭证_${safeName(r.title)}_${r.date||'未填写日期'}.png`),'image/png')};
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function voucherNo(r){return 'BX-'+String(r.date||'').replaceAll('-','')+'-'+String(r.id).slice(-6)}
$('#exportTable').onclick=()=>{const data=currentRecords();if(!data.length)return alert('当前没有可以导出的记录');const heads=['序号','凭证编号','购买日期','购买内容','金额（元）','分类','项目/部门','截止日期','状态','是否逾期','票据文件','备注'];const rows=data.map((r,i)=>[i+1,voucherNo(r),r.date,r.title,Number(r.amount).toFixed(2),r.category,r.project||'',r.deadline||'',r.status,overdue(r)?'是':'否',r.receipt||'',r.note||'']);const csv='\uFEFF'+[heads,...rows].map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),`记账报销清单_${filter==='all'?'全部':filter}_${new Date().toISOString().slice(0,10)}.csv`)};
$('#exportAllVouchers').onclick=()=>{const data=currentRecords();if(!data.length)return alert('当前没有可以导出的记录');if(data.length>8&&!confirm(`将连续下载 ${data.length} 张凭证图片，是否继续？`))return;data.forEach((r,i)=>setTimeout(()=>exportVoucher(r.id),i*350))};
window.advance=id=>{const r=records.find(x=>x.id===id);r.status=r.status==='待报销'?'已提交':'已到账';save()};window.removeItem=id=>{if(confirm('确定删除这条记录吗？')){records=records.filter(x=>x.id!==id);save()}};
$('.fab').onclick=()=>{$('#modal').classList.add('show');$('#form').date.value=new Date().toISOString().slice(0,10)};$('#cancelBtn').onclick=()=>$('#modal').classList.remove('show');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
$('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),file=f.get('receipt');records.unshift({id:Date.now().toString(),title:f.get('title'),amount:f.get('amount'),date:f.get('date'),deadline:f.get('deadline'),category:f.get('category'),project:f.get('project'),note:f.get('note'),receipt:file&&file.name?file.name:'',status:'待报销'});e.target.reset();$('#modal').classList.remove('show');save()};render();
</script>
</body>
</html>
