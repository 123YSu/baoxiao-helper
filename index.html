<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>记账报销助手</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:"Microsoft YaHei",system-ui,sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:90px}.hero{padding:26px 20px 24px;background:linear-gradient(135deg,#2563eb,#5b7cff);color:#fff;border-radius:0 0 28px 28px}.hero h1{margin:0 0 8px;font-size:26px}.hero p{margin:0;opacity:.88}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 14px}.stat,.card{background:#fff;border:1px solid #e7ebf3;border-radius:18px;box-shadow:0 8px 24px #23408b0d}.stat{padding:14px 8px;text-align:center}.stat strong{display:block;font-size:20px;color:#2459d3}.stat span{font-size:12px;color:#748096}.toolbar{display:flex;gap:8px;padding:0 14px 10px;overflow-x:auto}.toolbar button{border:0;border-radius:12px;padding:10px 13px;background:#fff;color:#33415c;font-weight:600;white-space:nowrap}.toolbar .active{background:#e8efff;color:#2459d3}.exportbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 12px}.exportbar button{border:1px solid #dbe4fa;border-radius:12px;padding:11px;background:#fff;color:#2856c5;font-weight:700}.exportbar button:disabled{opacity:.55}.list{padding:0 14px;display:grid;gap:12px}.empty{text-align:center;padding:48px 20px;color:#8691a5}.item{padding:16px}.row{display:flex;justify-content:space-between;gap:12px}.item h3{margin:0 0 5px;font-size:17px}.amount{font-size:19px;font-weight:800;color:#172033}.meta{font-size:13px;color:#7b879b;line-height:1.8}.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;background:#eef3ff;color:#3563d7}.badge.overdue{background:#ffeded;color:#d83b3b}.receipt-ok{color:#21824c}.receipt-missing{color:#d17a16}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.actions button{border:0;border-radius:10px;padding:9px;background:#edf2ff;color:#2856c5}.actions .danger{background:#fff0f0;color:#c33}.actions button:disabled{color:#8a94a7}.fab{position:fixed;right:max(20px,calc((100vw - 720px)/2 + 20px));bottom:22px;border:0;border-radius:18px;padding:15px 20px;background:#2563eb;color:#fff;font-size:16px;font-weight:700;box-shadow:0 12px 30px #2563eb55}.modal{position:fixed;inset:0;background:#11182780;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{width:min(100%,720px);max-height:92vh;overflow:auto;margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:22px 18px 30px}.sheet h2{margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#5d697d}.field input,.field select,.field textarea{width:100%;border:1px solid #dce2ec;border-radius:12px;padding:12px;font:inherit}.field textarea{min-height:72px;resize:vertical}.submit{width:100%;margin-top:18px;border:0;border-radius:13px;padding:14px;background:#2563eb;color:#fff;font-size:16px;font-weight:700}.cancel{width:100%;margin-top:8px;border:0;background:#fff;padding:12px;color:#667085}.hint{padding:0 14px 12px;color:#8a94a7;font-size:12px}@media(max-width:440px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding-top:22px}.stat strong{font-size:17px}}
  </style>
</head>
<body>
<main class="app">
  <section class="hero"><h1>记账报销助手</h1><p>买完立即记，报销不再忘</p></section>
  <section class="stats">
    <div class="stat"><strong id="pendingMoney">¥0.00</strong><span>待报销</span></div>
    <div class="stat"><strong id="pendingCount">0</strong><span>待处理</span></div>
    <div class="stat"><strong id="overdueCount">0</strong><span>已逾期</span></div>
  </section>
  <nav class="toolbar">
    <button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="待报销">待报销</button><button class="filter" data-filter="已提交">已提交</button><button class="filter" data-filter="已到账">已到账</button>
  </nav>
  <section class="exportbar"><button id="exportTable">⇩ 导出 Excel（含票据）</button><button id="exportAllVouchers">▧ 批量导出凭证图片</button></section>
  <div class="hint">Excel 为 .xlsx 格式，票据照片直接嵌入表格；旧记录请先点击“补传票据”。</div>
  <section class="list" id="list"></section>
  <button class="fab" id="addBtn">＋ 记一笔</button>
</main>
<div class="modal" id="modal"><form class="sheet" id="form">
  <h2>新增报销记录</h2><div class="grid">
    <div class="field full"><label>购买内容 *</label><input name="title" required placeholder="例如：打印纸"></div>
    <div class="field"><label>金额（元）*</label><input name="amount" required type="number" min="0" step="0.01" placeholder="0.00"></div>
    <div class="field"><label>购买日期 *</label><input name="date" required type="date"></div>
    <div class="field"><label>报销截止日期</label><input name="deadline" type="date"></div>
    <div class="field"><label>分类</label><select name="category"><option>办公用品</option><option>差旅</option><option>餐饮</option><option>交通</option><option>其他</option></select></div>
    <div class="field"><label>项目或部门</label><input name="project" placeholder="选填"></div>
    <div class="field"><label>票据照片</label><input name="receipt" type="file" accept="image/*" capture="environment"></div>
    <div class="field full"><label>备注</label><textarea name="note" placeholder="发票情况、报销说明等"></textarea></div>
  </div><button class="submit">保存记录</button><button class="cancel" type="button" id="cancelBtn">取消</button>
</form></div>
<script>
const KEY='baoxiao-helper-v1',DB_NAME='baoxiao-helper-files';let records=JSON.parse(localStorage.getItem(KEY)||'[]'),filter='all';
const $=s=>document.querySelector(s),money=n=>'¥'+Number(n).toFixed(2),save=()=>{localStorage.setItem(KEY,JSON.stringify(records));render()};
const currentRecords=()=>records.filter(r=>filter==='all'||r.status===filter);
function overdue(r){return r.status!=='已到账'&&r.deadline&&r.deadline<new Date().toISOString().slice(0,10)}
function render(){const shown=currentRecords();$('#list').innerHTML=shown.length?shown.map(r=>`<article class="card item"><div class="row"><div><h3>${esc(r.title)}</h3><span class="badge ${overdue(r)?'overdue':''}">${overdue(r)?'已逾期':r.status}</span></div><div class="amount">${money(r.amount)}</div></div><div class="meta">${esc(r.category)} · ${esc(r.date)}${r.deadline?' · 截止 '+esc(r.deadline):''}${r.project?' · '+esc(r.project):''}<br><span class="${r.receiptStored?'receipt-ok':'receipt-missing'}">${r.receiptStored?'✓ 票据照片已保存':r.receipt?'⚠ 仅有文件名，请补传照片':'⚠ 尚未上传票据照片'}</span>${r.note?'<br>'+esc(r.note):''}</div><div class="actions">${r.status==='待报销'?`<button onclick="advance('${r.id}')">标记已提交</button>`:r.status==='已提交'?`<button onclick="advance('${r.id}')">确认已到账</button>`:'<button disabled>已完成</button>'}<button onclick="updateReceipt('${r.id}')">${r.receiptStored?'更换票据':'补传票据'}</button><button onclick="exportVoucher('${r.id}')">导出凭证</button><button class="danger" onclick="removeItem('${r.id}')">删除</button></div></article>`).join(''):'<div class="empty">当前没有可导出的记录<br>点击右下角“记一笔”开始使用</div>';const pending=records.filter(r=>r.status!=='已到账');$('#pendingMoney').textContent=money(pending.reduce((s,r)=>s+Number(r.amount),0));$('#pendingCount').textContent=pending.length;$('#overdueCount').textContent=pending.filter(overdue).length}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function xml(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}
function safeName(v=''){return String(v).replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,30)||'报销'}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function openDb(){return new Promise((ok,no)=>{const q=indexedDB.open(DB_NAME,1);q.onupgradeneeded=()=>q.result.createObjectStore('receipts');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
async function receiptPut(id,value){const db=await openDb();return new Promise((ok,no)=>{const q=db.transaction('receipts','readwrite').objectStore('receipts').put(value,id);q.onsuccess=()=>ok();q.onerror=()=>no(q.error)})}
async function receiptGet(id){const db=await openDb();return new Promise((ok,no)=>{const q=db.transaction('receipts').objectStore('receipts').get(id);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>no(q.error)})}
async function receiptDelete(id){const db=await openDb();return new Promise(ok=>{const q=db.transaction('receipts','readwrite').objectStore('receipts').delete(id);q.onsuccess=q.onerror=()=>ok()})}
function compressPhoto(file){return new Promise((ok,no)=>{const reader=new FileReader();reader.onerror=()=>no(new Error('照片读取失败'));reader.onload=()=>{const img=new Image();img.onerror=()=>no(new Error('照片格式无法识别'));img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8))};img.src=reader.result};reader.readAsDataURL(file)})}
window.updateReceipt=id=>{const input=document.createElement('input');input.type='file';input.accept='image/*';input.capture='environment';input.onchange=async()=>{const file=input.files[0];if(!file)return;try{const dataUrl=await compressPhoto(file);await receiptPut(id,{dataUrl,name:file.name});const r=records.find(x=>x.id===id);r.receipt=file.name;r.receiptStored=true;save();alert('票据照片已保存，导出 Excel 时会直接显示图片。')}catch(e){alert(e.message||'票据保存失败')}};input.click()};
function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines=3){let line='',lines=0;for(const ch of String(text||'—')){if(ctx.measureText(line+ch).width>maxWidth&&line){ctx.fillText(line,x,y+lines*lineHeight);line=ch;if(++lines>=maxLines-1)break}else line+=ch}ctx.fillText(line,x,y+lines*lineHeight)}
window.exportVoucher=id=>{const r=records.find(x=>x.id===id);if(!r)return;const c=document.createElement('canvas');c.width=1200;c.height=1500;const x=c.getContext('2d');x.fillStyle='#f4f7ff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';roundRect(x,70,70,1060,1360,34);x.fill();x.fillStyle='#2563eb';x.fillRect(70,70,1060,18);x.fillStyle='#172033';x.textAlign='center';x.font='bold 58px Microsoft YaHei, sans-serif';x.fillText('报 销 凭 证',600,180);x.font='26px Microsoft YaHei, sans-serif';x.fillStyle='#758097';x.fillText('记账报销助手 · 电子凭证',600,230);x.textAlign='left';x.strokeStyle='#e1e7f0';x.lineWidth=2;x.strokeRect(130,300,940,810);const rows=[['凭证编号',voucherNo(r)],['购买日期',r.date||'—'],['购买内容',r.title||'—'],['报销金额','人民币 '+Number(r.amount).toFixed(2)+' 元'],['费用分类',r.category||'—'],['项目/部门',r.project||'—'],['报销状态',overdue(r)?'已逾期':r.status],['截止日期',r.deadline||'—'],['票据附件',r.receiptStored?'照片已保存':r.receipt||'未记录'],['备注',r.note||'—']];let y=300;rows.forEach((row,i)=>{const h=i===9?150:73;x.fillStyle=i%2?'#fbfcff':'#f5f8ff';x.fillRect(130,y,940,h);x.strokeStyle='#e1e7f0';x.strokeRect(130,y,940,h);x.fillStyle='#647087';x.font='26px Microsoft YaHei, sans-serif';x.fillText(row[0],165,y+46);x.fillStyle=i===3?'#d93f3f':'#172033';x.font=i===3?'bold 30px Microsoft YaHei, sans-serif':'28px Microsoft YaHei, sans-serif';wrapText(x,row[1],360,y+46,670,38,i===9?3:1);y+=h});x.fillStyle='#667085';x.font='24px Microsoft YaHei, sans-serif';x.fillText('经办人签字：________________',150,1205);x.fillText('审核人签字：________________',650,1205);x.fillStyle='#98a1b2';x.font='21px Microsoft YaHei, sans-serif';x.textAlign='center';x.fillText('生成时间：'+new Date().toLocaleString('zh-CN'),600,1340);x.fillText('本凭证由记账报销助手根据登记信息生成，请与原始票据一并使用。',600,1385);c.toBlob(b=>download(b,`报销凭证_${safeName(r.title)}_${r.date||'未填写日期'}.png`),'image/png')};
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function voucherNo(r){return 'BX-'+String(r.date||'').replaceAll('-','')+'-'+String(r.id).slice(-6)}
function colName(n){let s='';while(n){s=String.fromCharCode(65+(n-1)%26)+s;n=Math.floor((n-1)/26)}return s}
function inlineCell(ref,value,style=3){return `<c r="${ref}" s="${style}" t="inlineStr"><is><t>${xml(value??'')}</t></is></c>`}
function numberCell(ref,value){return `<c r="${ref}" s="2"><v>${Number(value)||0}</v></c>`}
function dataUrlBytes(url){const raw=atob(url.split(',')[1]),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}
function buildXlsx(data,receipts){const headers=['序号','凭证编号','购买日期','购买内容','金额（元）','分类','项目/部门','截止日期','状态','备注','票据照片'];const imageRows=[];let rows=`<row r="1" ht="28" customHeight="1">${headers.map((h,i)=>inlineCell(colName(i+1)+'1',h,1)).join('')}</row>`;data.forEach((r,i)=>{const n=i+2,vals=[i+1,voucherNo(r),r.date,r.title,null,r.category,r.project||'',r.deadline||'',overdue(r)?'已逾期':r.status,r.note||'',receipts[i]?.dataUrl?'见右侧图片':r.receipt?'请补传：'+r.receipt:'未上传'];rows+=`<row r="${n}" ht="78" customHeight="1">${vals.map((v,j)=>j===4?numberCell('E'+n,r.amount):inlineCell(colName(j+1)+n,v,j===0?4:3)).join('')}</row>`;if(receipts[i]?.dataUrl)imageRows.push({row:i+1,bytes:dataUrlBytes(receipts[i].dataUrl)})});const hasImages=imageRows.length>0,drawingTag=hasImages?'<drawing r:id="rId1"/>':'';const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="18"/><cols><col min="1" max="1" width="8" customWidth="1"/><col min="2" max="2" width="22" customWidth="1"/><col min="3" max="3" width="14" customWidth="1"/><col min="4" max="4" width="24" customWidth="1"/><col min="5" max="5" width="14" customWidth="1"/><col min="6" max="6" width="14" customWidth="1"/><col min="7" max="7" width="18" customWidth="1"/><col min="8" max="8" width="14" customWidth="1"/><col min="9" max="9" width="13" customWidth="1"/><col min="10" max="10" width="28" customWidth="1"/><col min="11" max="11" width="25" customWidth="1"/></cols><sheetData>${rows}</sheetData><autoFilter ref="A1:K${data.length+1}"/>${drawingTag}</worksheet>`;const files=[{name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${hasImages?'<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>':''}</Types>`},{name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},{name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="报销清单" sheetId="1" r:id="rId1"/></sheets></workbook>`},{name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},{name:'xl/styles.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Microsoft YaHei"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Microsoft YaHei"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF2563EB"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border/><border><left style="thin"><color rgb="FFD9E1EF"/></left><right style="thin"><color rgb="FFD9E1EF"/></right><top style="thin"><color rgb="FFD9E1EF"/></top><bottom style="thin"><color rgb="FFD9E1EF"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf><xf numFmtId="4" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},{name:'xl/worksheets/sheet1.xml',data:sheet}];if(hasImages){files.push({name:'xl/worksheets/_rels/sheet1.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing1.xml"/></Relationships>`});const anchors=imageRows.map((im,i)=>`<xdr:oneCellAnchor><xdr:from><xdr:col>10</xdr:col><xdr:colOff>80000</xdr:colOff><xdr:row>${im.row}</xdr:row><xdr:rowOff>50000</xdr:rowOff></xdr:from><xdr:ext cx="1420000" cy="850000"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${i+2}" name="票据照片${i+1}"/><xdr:cNvPicPr/></xdr:nvPicPr><xdr:blipFill><a:blip r:embed="rId${i+1}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="1420000" cy="850000"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`).join('');files.push({name:'xl/drawings/drawing1.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">${anchors}</xdr:wsDr>`},{name:'xl/drawings/_rels/drawing1.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${imageRows.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image${i+1}.jpeg"/>`).join('')}</Relationships>`});imageRows.forEach((im,i)=>files.push({name:`xl/media/image${i+1}.jpeg`,data:im.bytes}))}return zipStore(files)}
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(a){let c=0xffffffff;for(const b of a)c=CRC_TABLE[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}
function u16(n){const a=new Uint8Array(2);new DataView(a.buffer).setUint16(0,n,true);return a}function u32(n){const a=new Uint8Array(4);new DataView(a.buffer).setUint32(0,n>>>0,true);return a}function join(parts){const n=parts.reduce((s,a)=>s+a.length,0),out=new Uint8Array(n);let p=0;for(const a of parts){out.set(a,p);p+=a.length}return out}
function zipStore(files){const enc=new TextEncoder(),locals=[],centrals=[];let offset=0;for(const f of files){const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data),local=join([u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);locals.push(local);centrals.push(join([u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]));offset+=local.length}const central=join(centrals),end=join([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(central.length),u32(offset),u16(0)]);return join([...locals,central,end])}
$('#exportTable').onclick=async()=>{const data=currentRecords(),btn=$('#exportTable');if(!data.length)return alert('当前没有可以导出的记录');btn.disabled=true;btn.textContent='正在生成 Excel…';try{const receipts=await Promise.all(data.map(r=>receiptGet(r.id).catch(()=>null))),bytes=buildXlsx(data,receipts);download(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`记账报销清单_${filter==='all'?'全部':filter}_${new Date().toISOString().slice(0,10)}.xlsx`)}catch(e){console.error(e);alert('Excel 生成失败，请稍后重试。')}finally{btn.disabled=false;btn.textContent='⇩ 导出 Excel（含票据）'}};
$('#exportAllVouchers').onclick=()=>{const data=currentRecords();if(!data.length)return alert('当前没有可以导出的记录');if(data.length>8&&!confirm(`将连续下载 ${data.length} 张凭证图片，是否继续？`))return;data.forEach((r,i)=>setTimeout(()=>exportVoucher(r.id),i*350))};
window.advance=id=>{const r=records.find(x=>x.id===id);r.status=r.status==='待报销'?'已提交':'已到账';save()};window.removeItem=async id=>{if(confirm('确定删除这条记录及其票据照片吗？')){records=records.filter(x=>x.id!==id);await receiptDelete(id);save()}};
$('.fab').onclick=()=>{$('#modal').classList.add('show');$('#form').date.value=new Date().toISOString().slice(0,10)};$('#cancelBtn').onclick=()=>$('#modal').classList.remove('show');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
$('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),file=f.get('receipt'),id=Date.now().toString(),record={id,title:f.get('title'),amount:f.get('amount'),date:f.get('date'),deadline:f.get('deadline'),category:f.get('category'),project:f.get('project'),note:f.get('note'),receipt:file&&file.name?file.name:'',receiptStored:false,status:'待报销'};try{if(file&&file.size){const dataUrl=await compressPhoto(file);await receiptPut(id,{dataUrl,name:file.name});record.receiptStored=true}records.unshift(record);e.target.reset();$('#modal').classList.remove('show');save()}catch(err){alert(err.message||'票据照片保存失败，请重新选择')}};render();
