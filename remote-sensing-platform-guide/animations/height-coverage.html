<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>把传感器升高，会发生什么？</title>
<style>
*{box-sizing:border-box}
:root{--blue:#4b94df;--navy:#0c3568;--muted:#687e99;--panel:#fff;--line:#d9e6f3;--orange:#f5a623;--green:#3d985c}
html,body{margin:0;width:100%;height:100%;font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;background:#eef5fb;color:var(--navy);overflow:hidden}
.page{width:100vw;height:100vh;min-height:650px;padding:3.2vh 4.5vw 3.6vh;display:grid;grid-template-rows:auto 1fr;gap:2.2vh}
.top{display:grid;grid-template-columns:1.2fr .8fr;align-items:end;gap:4vw}
.index{font-weight:800;color:var(--blue);letter-spacing:.08em;font-size:clamp(15px,1.1vw,22px);margin-bottom:1.7vh}
h1{margin:0;font-size:clamp(40px,4.3vw,76px);line-height:1.06;letter-spacing:-.03em}
.desc{color:#6d819a;font-size:clamp(16px,1.45vw,26px);line-height:1.75;padding-bottom:.7vh}
.lab{min-height:0;border:1px solid #d6e4f2;border-radius:28px;background:#fff;overflow:hidden;box-shadow:0 22px 55px rgba(41,76,110,.12);display:grid;grid-template-columns:1.15fr .85fr}
.stage{position:relative;overflow:hidden;background:linear-gradient(#dff1ff 0%,#f6fbff 76%,#d7edc9 76%,#b8db99 88%,#8fbd63 88%,#7cac55 100%)}
.sun{position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.88);right:18%;top:10%;box-shadow:0 0 35px rgba(255,255,255,.55)}
.axis{position:absolute;left:42px;top:6%;bottom:13%;width:3px;background:#4b94df}
.axis:before{content:"↑";position:absolute;top:-17px;left:-9px;color:#4b94df;font-size:30px;font-weight:800}
.axis .high{position:absolute;top:-3px;left:15px;color:#4b94df;font-weight:800}.axis .low{position:absolute;bottom:-3px;left:15px;color:#4b94df;font-weight:800}
.ground-line{position:absolute;left:0;right:0;bottom:13%;height:3px;background:rgba(245,166,35,.55);border-top:2px dashed rgba(245,166,35,.45)}
.tree{position:absolute;left:20%;bottom:5.5%;font-size:68px;color:#3b7c42;filter:saturate(.85)}
.house{position:absolute;left:74%;bottom:5.2%;font-size:60px;color:#1b5796}
.field{position:absolute;left:39%;bottom:1.6%;width:34%;height:72px;border:2px solid rgba(255,255,255,.62);transform:perspective(180px) rotateX(58deg);background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.45) 23px 25px),repeating-linear-gradient(0deg,transparent 0 18px,rgba(255,255,255,.45) 19px 21px)}
.footprint{position:absolute;left:50%;bottom:1.4%;height:78px;border:3px solid var(--c);border-radius:50%;transform:translateX(-50%);background:color-mix(in srgb,var(--c) 10%,transparent);transition:width .65s ease,border-color .45s ease,background .45s ease;box-shadow:0 0 0 1px rgba(255,255,255,.15) inset}
.cone{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);clip-path:polygon(49% 0,51% 0,100% 100%,0 100%);background:linear-gradient(to bottom,color-mix(in srgb,var(--c) 26%,transparent),color-mix(in srgb,var(--c) 3%,transparent));opacity:.58;transition:width .65s ease,height .65s ease,background .45s ease}
.platform{position:absolute;left:47%;transform:translate(-50%,50%);display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--c);transition:bottom .65s cubic-bezier(.2,.8,.2,1),color .45s ease}
.icon{font-size:32px;line-height:1;filter:drop-shadow(0 4px 8px rgba(25,67,110,.18))}
.platform strong{background:#fff;border-radius:8px;padding:6px 10px;color:#123b70;font-size:clamp(13px,1vw,19px);box-shadow:0 4px 14px rgba(38,78,120,.1)}
.platform small{font-size:clamp(13px,1vw,19px);font-weight:800;color:#6e8298}
.panel{padding:5.2vh 4vw 4.1vh;display:flex;flex-direction:column;gap:2.5vh;background:#fff}
.eyebrow{color:#6f8298;font-weight:800;font-size:clamp(14px,1vw,18px)}
.type{font-size:clamp(34px,3vw,58px);font-weight:900;line-height:1;color:var(--c);transition:color .35s ease}
.current{font-size:clamp(18px,1.45vw,28px);font-weight:900;margin-top:-.8vh}
.sep{height:1px;background:#dce8f3}
.slider-label{font-weight:900;font-size:clamp(15px,1.1vw,20px)}
input[type=range]{width:100%;accent-color:#4b94df}
.range-labels{display:flex;justify-content:space-between;color:#73859c;font-size:clamp(13px,.95vw,17px);margin-top:-1.5vh}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#f2f7fc;border:1px solid #dbe8f4;border-radius:16px;padding:18px 20px;min-height:100px}
.card span{display:block;color:#6d829a;font-size:14px;margin-bottom:8px}.card b{font-size:clamp(17px,1.2vw,23px)}
.rule{margin-top:auto;background:#fff5e5;border-radius:16px;padding:18px 20px;text-align:center;font-weight:900;font-size:clamp(15px,1.15vw,21px)}
.rule .up{color:#f5a623}.rule .down{color:#4b94df}.rule i{font-style:normal;color:#f5a623;padding:0 8px}
.controls{display:flex;gap:10px;flex-wrap:wrap}
button{border:1px solid #cfe0ef;background:#f7fbff;color:#184678;border-radius:999px;padding:9px 14px;font-weight:800;cursor:pointer}
button.primary{background:#184678;color:#fff;border-color:#184678}
button:hover{transform:translateY(-1px)}
.badge{position:absolute;right:18px;bottom:16px;color:#6c8098;font-size:12px;background:rgba(255,255,255,.8);padding:6px 10px;border-radius:999px}
@media(max-width:900px){html,body{overflow:auto}.page{height:auto;min-height:100vh}.top{grid-template-columns:1fr}.lab{grid-template-columns:1fr;min-height:1000px}.stage{min-height:520px}.panel{min-height:470px}.controls{justify-content:flex-start}}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div>
      <div class="index">02 · 原理演示</div>
      <h1>把传感器升高，会发生什么？</h1>
    </div>
    <div class="desc">拖动滑杆，观察平台高度与地面覆盖范围之间的变化。<br>这里假设传感器条件近似相同。</div>
  </div>

  <section class="lab">
    <div class="stage" id="stage">
      <div class="sun"></div>
      <div class="axis"><span class="high">高</span><span class="low">低</span></div>
      <div class="cone" id="cone"></div>
      <div class="platform" id="platform"><span class="icon" id="icon">◆</span><strong id="pname">静止卫星</strong><small id="pheight">36,000 km</small></div>
      <div class="ground-line"></div>
      <div class="tree">♣</div>
      <div class="house">⌂</div>
      <div class="field"></div>
      <div class="footprint" id="footprint"></div>
      <div class="badge">高度与覆盖范围原理演示</div>
    </div>

    <div class="panel">
      <div class="eyebrow">当前平台</div>
      <div class="type" id="ptype">航天平台</div>
      <div class="current"><span id="pname2">静止卫星</span> · <span id="pheight2">36,000 km</span></div>
      <div class="sep"></div>
      <div class="slider-label">选择观测高度</div>
      <input id="slider" type="range" min="0" max="5" step="1" value="5"/>
      <div class="range-labels"><span>地面</span><span>航空</span><span>航天</span></div>
      <div class="cards">
        <div class="card"><span>观测范围</span><b id="range">近半个地球</b></div>
        <div class="card"><span>数据特点</span><b id="detail">持续观测同一区域</b></div>
      </div>
      <div class="rule"><span class="up">高度 ↑</span><i>→</i>地面视场 ↑<i>→</i><span class="down">单个目标细节通常 ↓</span></div>
      <div class="controls">
        <button class="primary" id="auto">暂停自动演示</button>
        <button id="restart">从最低处重播</button>
        <button id="copy">复制PPT链接</button>
        <button id="full">全屏</button>
      </div>
    </div>
  </section>
</div>

<script>
const levels=[
 {height:"2 m",name:"三脚架",type:"地面平台",range:"近距离",detail:"地物细节最丰富",marker:8,footprint:16,color:"#3d985c",icon:"▣"},
 {height:"50 m",name:"遥感塔",type:"地面平台",range:"样地尺度",detail:"适合连续定点观测",marker:20,footprint:24,color:"#3d985c",icon:"▣"},
 {height:"500 m",name:"无人机",type:"航空平台",range:"局部区域",detail:"高分辨率、机动灵活",marker:37,footprint:38,color:"#4b94df",icon:"✈"},
 {height:"6 km",name:"遥感飞机",type:"航空平台",range:"区域尺度",detail:"覆盖与细节较均衡",marker:58,footprint:58,color:"#4b94df",icon:"✈"},
 {height:"700 km",name:"对地观测卫星",type:"航天平台",range:"省域至全球",detail:"周期重复、覆盖范围广",marker:78,footprint:78,color:"#f5a623",icon:"◆"},
 {height:"36,000 km",name:"静止卫星",type:"航天平台",range:"近半个地球",detail:"持续观测同一区域",marker:94,footprint:96,color:"#f5a623",icon:"◆"}
];
let idx=5,playing=true,timer=null;
const el=id=>document.getElementById(id);
function render(i){
 idx=i; const d=levels[i]; document.documentElement.style.setProperty("--c",d.color);
 el("platform").style.bottom=d.marker+"%";
 el("footprint").style.width=d.footprint+"%";
 el("cone").style.width=Math.max(18,d.footprint)+"%";
 el("cone").style.height=Math.max(10,d.marker-3)+"%";
 el("icon").textContent=d.icon; el("pname").textContent=d.name; el("pheight").textContent=d.height;
 el("ptype").textContent=d.type; el("ptype").style.color=d.color;
 el("pname2").textContent=d.name; el("pheight2").textContent=d.height;
 el("range").textContent=d.range; el("detail").textContent=d.detail; el("slider").value=i;
}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function startAuto(){
 stopTimer(); playing=true; el("auto").textContent="暂停自动演示";
 timer=setInterval(()=>render((idx+1)%levels.length),2200);
}
function pauseAuto(){playing=false;stopTimer();el("auto").textContent="继续自动演示"}
el("slider").addEventListener("input",e=>{pauseAuto();render(+e.target.value)});
el("auto").onclick=()=>playing?pauseAuto():startAuto();
el("restart").onclick=()=>{render(0);startAuto()};
el("copy").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);const old=el("copy").textContent;el("copy").textContent="已复制";setTimeout(()=>el("copy").textContent=old,1400)}catch(e){prompt("复制这个链接到PPT：",location.href)}};
el("full").onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
document.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();playing?pauseAuto():startAuto()}if(e.key.toLowerCase()==="f")el("full").click()});
render(5); startAuto();
</script>
</body>
</html>
